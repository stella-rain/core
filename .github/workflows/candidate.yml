# Candidate (the release-flow skill, plan section 9). Kade runs this workflow on main, in the
# GitHub app too: main is the default branch, so there is nothing to type. The run keeps the
# commit it started on (GITHUB_SHA); a push to main during the run changes nothing. It
#   - refuses unless the ref is refs/heads/main, there is a commit since the latest release, the
#     commit is not already a candidate and every check run on it passed (.github/scripts/release.py),
#   - picks the final tag: Cargo.toml's version is a floor, so when it is at or below the latest
#     final tag the release is that tag's next patch, and writes it into Cargo.toml, Cargo.lock and
#     fuzz/Cargo.lock; main itself is never written to,
#   - runs the iOS Simulator tests and the long fuzz run (ADR-054) on the main commit, builds
#     `stage-verify` once on the four desktop runners from the stamped tree, so the binary carries
#     the final version, and runs each build on a corpus replay,
#   - tags vX.Y.Z-rc.N: the main commit itself when no stamp is needed, else one release commit
#     whose parent is the main commit and which changes only those version files. It makes a GitHub
#     prerelease with the four binaries, the JSON Schema and SHA256SUMS,
#   - makes the branch rc/<rc tag> at the tagged commit, for Promote (promote.yml) to run from (the
#     GitHub app lists branches only), and deletes the same version's lower rc branches.
# Only the tag job can write, and it runs none of the repository's code; it refuses unless the tree
# it creates is the one the check job stamped and the builds tested.
name: Candidate

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: check the candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read  # the check runs on the commit
    outputs:
      final: ${{ steps.check.outputs.final }}
      rc: ${{ steps.check.outputs.rc }}
      superseded: ${{ steps.check.outputs.superseded }}
      stamped: ${{ steps.check.outputs.stamped }}
      tree: ${{ steps.check.outputs.tree }}
      cargo_toml: ${{ steps.check.outputs.cargo_toml }}
      cargo_lock: ${{ steps.check.outputs.cargo_lock }}
      fuzz_lock: ${{ steps.check.outputs.fuzz_lock }}
      notes: ${{ steps.check.outputs.notes }}
    steps:
      - name: Only main is a candidate
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "::error::a candidate is made from refs/heads/main only; this run is on $REF"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Main again, something new, not a candidate yet, checks passed; stamp the version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py check-main "$GITHUB_REF"
          python3 .github/scripts/release.py check-release
          gh api --paginate "repos/$REPO/commits/$GITHUB_SHA/check-runs?per_page=100" \
            --jq '.check_runs[]' | jq -s '{check_runs: .}' \
            | python3 .github/scripts/release.py checks-passed "$GITHUB_RUN_ID"
          final=$(python3 .github/scripts/release.py final)
          rc=$(python3 .github/scripts/release.py rc "$final")
          superseded=$(python3 .github/scripts/release.py superseded "$rc")
          previous=$(python3 .github/scripts/release.py previous)
          if [ -n "$previous" ]; then
            git log --no-merges --format='%h %s' "$previous..$GITHUB_SHA" > "$RUNNER_TEMP/log.txt"
          else
            : > "$RUNNER_TEMP/log.txt"
          fi
          python3 .github/scripts/release.py notes "$rc" "$GITHUB_SHA" "${previous:--}" \
            "$RUNNER_TEMP/log.txt" > "$RUNNER_TEMP/notes.md"
          # The version file is a floor: stamp the final tag; no change means Cargo.toml has it.
          python3 .github/scripts/release.py stamp "$final"
          git add -- Cargo.toml Cargo.lock fuzz/Cargo.lock
          if git diff --cached --quiet; then
            stamped=false
            echo "$final is Cargo.toml's version: the tag goes on $GITHUB_SHA itself." >> "$RUNNER_TEMP/notes.md"
          else
            stamped=true
            echo "$final is the next patch of the latest release: a release commit on $GITHUB_SHA stamps the version." >> "$RUNNER_TEMP/notes.md"
          fi
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo "final=$final"
            echo "rc=$rc"
            echo "superseded=$superseded"
            echo "stamped=$stamped"
            echo "tree=$(git write-tree)"
            echo "cargo_toml=$(base64 -w0 Cargo.toml)"
            echo "cargo_lock=$(base64 -w0 Cargo.lock)"
            echo "fuzz_lock=$(base64 -w0 fuzz/Cargo.lock)"
            echo "notes=$(base64 -w0 "$RUNNER_TEMP/notes.md")"
          } >> "$GITHUB_OUTPUT"

  # The checks of ADR-054 that are not on every pull request. Their check runs are named
  # "release <workflow> / <job>", which release.py leaves out of the next candidate's checks.
  ios-simulator:
    name: release iOS Simulator
    needs: check
    uses: ./.github/workflows/ios-sim.yml
    permissions:
      contents: read

  long-fuzz:
    name: release long fuzz
    needs: check
    uses: ./.github/workflows/fuzz-long.yml
    with:
      # Longer than the weekly run's 7: about 20 minutes of wall time, 6 targets in parallel.
      minutes: 15
    # A crash opens the same hash-only issue as a weekly run (fuzz-long.yml needs issues: write).
    permissions:
      contents: read
      issues: write

  build:
    name: stage-verify on ${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: linux-x86_64
            runner: ubuntu-latest
          - arch: linux-arm64
            runner: ubuntu-24.04-arm
          - arch: windows-x86_64
            runner: windows-latest
            ext: .exe
          - arch: macos-arm64
            runner: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Stamp the version, and build only the tree that was checked
        env:
          FINAL: ${{ needs.check.outputs.final }}
          TREE: ${{ needs.check.outputs.tree }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py stamp "$FINAL"
          git add -- Cargo.toml Cargo.lock fuzz/Cargo.lock
          if [ "$(git write-tree)" != "$TREE" ]; then
            echo "::error::the stamped tree $(git write-tree) is not the checked $TREE"
            exit 1
          fi
      - run: rustc -vV
      - run: cargo build --release --locked --bin stage-verify
      - name: The built binary clears a corpus replay with every tick's hash
        env:
          EXT: ${{ matrix.ext }}
        run: |
          set -euo pipefail
          case=tests/corpus/v0/clear
          "target/release/stage-verify$EXT" "$case/stage.json" "$case/run.replay" --hashes "$case/hashes.txt"
      - name: Name the files after the release
        env:
          FINAL: ${{ needs.check.outputs.final }}
          ARCH: ${{ matrix.arch }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir dist
          cp "target/release/stage-verify$EXT" "dist/stage-verify-$FINAL-$ARCH$EXT"
          # The schema does not depend on the runner: one copy, from the first.
          if [ "$ARCH" = linux-x86_64 ]; then cp schema/*.schema.json dist/; fi
      - uses: actions/upload-artifact@v7
        with:
          name: stage-verify-${{ matrix.arch }}
          path: dist/
          if-no-files-found: error

  tag:
    name: rc tag and prerelease
    needs: [check, ios-simulator, long-fuzz, build]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # the release commit, the rc tag, the prerelease and the rc branches
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: stage-verify-*
          path: dist
          merge-multiple: true
      - name: Create the release commit if needed, the rc tag, the prerelease and the rc/ branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          FINAL: ${{ needs.check.outputs.final }}
          RC: ${{ needs.check.outputs.rc }}
          SUPERSEDED: ${{ needs.check.outputs.superseded }}
          STAMPED: ${{ needs.check.outputs.stamped }}
          TREE: ${{ needs.check.outputs.tree }}
          CARGO_TOML: ${{ needs.check.outputs.cargo_toml }}
          CARGO_LOCK: ${{ needs.check.outputs.cargo_lock }}
          FUZZ_LOCK: ${{ needs.check.outputs.fuzz_lock }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          set -euo pipefail
          commit=$GITHUB_SHA
          if [ "$STAMPED" = true ]; then
            blob() { gh api "repos/$REPO/git/blobs" -f encoding=base64 -f content="$1" --jq .sha; }
            base=$(gh api "repos/$REPO/git/commits/$GITHUB_SHA" --jq .tree.sha)
            tree=$(jq -n --arg base "$base" --arg a "$(blob "$CARGO_TOML")" \
                         --arg b "$(blob "$CARGO_LOCK")" --arg c "$(blob "$FUZZ_LOCK")" \
                     '{base_tree: $base, tree: [
                        {path: "Cargo.toml", mode: "100644", type: "blob", sha: $a},
                        {path: "Cargo.lock", mode: "100644", type: "blob", sha: $b},
                        {path: "fuzz/Cargo.lock", mode: "100644", type: "blob", sha: $c}]}' \
                   | gh api "repos/$REPO/git/trees" --input - --jq .sha)
            if [ "$tree" != "$TREE" ]; then
              echo "::error::the tree $tree is not the tested $TREE"
              exit 1
            fi
            commit=$(jq -n --arg msg "Release $FINAL" --arg tree "$tree" --arg parent "$GITHUB_SHA" \
                       '{message: $msg, tree: $tree, parents: [$parent]}' \
                     | gh api "repos/$REPO/git/commits" --input - --jq .sha)
          fi
          (cd dist && sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS")
          mv "$RUNNER_TEMP/SHA256SUMS" dist/SHA256SUMS
          base64 -d <<<"$NOTES" > "$RUNNER_TEMP/notes.md"
          # An annotated tag object, then its ref; `gh release create` alone would make a
          # lightweight tag.
          object=$(gh api "repos/$REPO/git/tags" -f tag="$RC" -f message="$RC" \
                     -f object="$commit" -f type=commit --jq .sha)
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$RC" -f sha="$object" > /dev/null
          gh release create "$RC" --repo "$REPO" --verify-tag --prerelease --title "$RC" \
            --notes-file "$RUNNER_TEMP/notes.md" dist/*
          gh api "repos/$REPO/git/refs" -f ref="refs/heads/rc/$RC" -f sha="$commit" > /dev/null
          for b in $SUPERSEDED; do
            gh api -X DELETE "repos/$REPO/git/refs/heads/$b" > /dev/null || echo "::warning::could not delete $b"
          done
          {
            echo "Candidate $RC of $FINAL at $commit (main at $GITHUB_SHA)."
            if [ -n "$SUPERSEDED" ]; then echo "Deleted the superseded $SUPERSEDED."; fi
            echo "Try it, then Actions > Promote > Run workflow > branch rc/$RC."
          } >> "$GITHUB_STEP_SUMMARY"
