# THROWAWAY probe (CORE-ANDROID-EMU step 1): prints what an x86_64 runner offers for an Android
# emulator. Deleted in the same PR before review.
name: Android emulator probe

on:
  pull_request:
    paths:
      - ".github/workflows/android-emu-probe.yml"

permissions: {}

jobs:
  probe:
    name: probe (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest]
    steps:
      - name: Print what the runner has
        run: |
          uname -m
          ls -l /dev/kvm || true
          grep -c -E 'vmx|svm' /proc/cpuinfo || true
          echo "NDK=$ANDROID_NDK_LATEST_HOME HOME=$ANDROID_HOME"
          ls "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt" || true
          which sdkmanager avdmanager adb || true
          ls "$ANDROID_NDK_LATEST_HOME"/toolchains/llvm/prebuilt/linux-x86_64/bin/*android24-clang || true
          basename "$ANDROID_NDK_LATEST_HOME"
          id
