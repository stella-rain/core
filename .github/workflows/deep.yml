# The deep tier: the tests that are too long for a PR. Every property runs 2,000 cases instead of
# 64 (tests/properties.rs reads PROPTEST_CASES) and the `#[ignore]`d tests run too, the
# MAX_COMMANDS measurement of tests/command_cap.rs among them; in release, on all tests of the
# crate. Weekly, on demand, and called by Candidate (candidate.yml) on the commit it makes a candidate of.
# Not a PR check, so auto-merge.yml names nothing from it; main-red.yml reports a failed weekly run.
# The times of every test are in the JUnit file of the run's artifact (.config/nextest.toml).
name: Deep

on:
  schedule:
    # Saturdays 04:41 UTC, away from the Rust run (Sundays 04:17) and the long fuzz run (Mondays 03:23).
    - cron: "41 4 * * 6"
  workflow_dispatch:
  workflow_call:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  deep:
    name: deep tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
          fallback: none
      - name: Run every test, 2,000 cases per property, the ignored ones included
        env:
          PROPTEST_CASES: "2000"
        run: cargo nextest run --locked --release --all-features --run-ignored all --profile ci
      - name: Upload the test times
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-deep
          path: target/nextest/ci/junit.xml
          if-no-files-found: ignore
