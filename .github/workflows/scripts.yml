# Unit tests of the Python scripts in .github/scripts (release.py). Runs on every pull
# request, so auto-merge.yml requires it.
name: Scripts

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  test:
    name: script unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s .github/scripts -v
