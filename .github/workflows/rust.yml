# Rust gates (AGENTS.md): fmt, clippy, and the tests in debug and release on x86_64 and on an
# arm64 runner, which must agree on the same golden state hash (ADR-SIM-3), and on the Windows
# x86_64 and macOS arm64 runners, so every shipped desktop hashes alike (ADR-PLAT-1); plus `cargo check`
# for the mobile targets (ADR-PLAT-1: arm64-v8a and x86_64 Android, iOS kept buildable); and the
# fuzz targets (ADR-SVC-1): tested and linted on stable, built on a pinned nightly, and run for a
# minute each when a PR touches parsing; and the instruction counts of the worst-case tick and of
# the friendly-bullet collision tick and the heaviest tick of a time_limit run (ADR-SIM-5),
# each compared with the base commit's on
# both architectures, which uploads a per-function profile (`bench-profile-<arch>`) every run, blocks
# on the absolute budgets of benches/budgets.toml and fails a case that rose over BENCH_ALARM_PCT
# unless a new entry of benches/accepted.toml covers it (ADR-SIM-6 points 1 and 3); and the dependency audit (`cargo deny`, deny.toml, one job on a pinned binary), whose advisories change
# without a PR, which the weekly run catches. They are jobs of this workflow because
# auto-merge.yml waits for the workflows it names.
# The `net/` crate has its own job (`net`): the other jobs select core alone.
# A PR into main whose files are all `*.md` runs none of them: `what changed` says so, and every
# Rust job waits on it. A push to main runs `what changed`, the bench and its profile (the bench
# saves the per-sha base counts that PRs restore) and the rest of the suite only when
# Cargo.lock, fuzz/Cargo.lock, rust-toolchain.toml or this file changed (those refresh the
# caches; every other change was tested in its PR). The weekly run and every PR run all of it.
# `rust checks` always runs and fails when a job it needs failed, was cancelled, or was skipped
# though it had to run, so auto-merge.yml requires only that one check, which a docs-only PR
# passes too. A
# newer push to a PR cancels the run of the older one. `frozen corpus unchanged` runs on every PR,
# docs-only ones too (its diff step; the manifest test runs in `tests`): a PR may not modify, delete or rename a frozen corpus file.
# Weekly, the whole workflow also runs on main, so a toolchain or runner change, or a main that
# no push run re-tested (merges by GITHUB_TOKEN start none), fails within a week; PR-only jobs
# are skipped and the benchmark counts without comparing. It is not a PR check, so auto-merge.yml
# requires nothing from it.
name: Rust

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Sundays 04:17 UTC, away from the long fuzz run (Mondays 03:23).
    - cron: "17 4 * * 0"

permissions: {}

# One run per PR: a new push cancels the older one. Runs on main (push, weekly) are never
# cancelled: each has its own group (the sha), so a push gate that diffs one push is never lost
# to a newer pending run that replaced it.
concurrency:
  group: rust-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # `cargo fuzz` needs a nightly compiler; everything else stays on the pinned stable one. A
  # dated nightly and a pinned cargo-fuzz keep the fuzz jobs from changing under a PR.
  FUZZ_NIGHTLY: nightly-2026-10-09
  CARGO_FUZZ_VERSION: 0.13.2
  # Must be the version of the `iai-callgrind` dev-dependency in Cargo.toml.
  IAI_CALLGRIND_RUNNER_VERSION: 0.16.1
  # The most a bench case may rise against the base commit, in percent, before the bench job fails
  # unless benches/accepted.toml covers it (ADR-SIM-6 point 3). A tuning value: a change is a workflow
  # change, so Kade's.
  BENCH_ALARM_PCT: "2"

jobs:
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      code: ${{ steps.diff.outputs.code }}
      tune-changes: ${{ steps.diff.outputs.tune-changes }}
      suite: ${{ steps.diff.outputs.suite }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        with:
          fetch-depth: 0
          persist-credentials: false
      # `code` is false only for a PR into main whose files are all `*.md` (no Rust code reads one).
      # `suite` is false only for a push to main that changed none of the files that refresh the
      # caches (the lockfiles, the toolchain pin, this workflow): the PR that merged it ran the
      # suite already, so the push runs the bench alone, which saves the base counts the next PRs
      # restore. A push whose range cannot be diffed, the weekly run and every PR run the suite.
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          BASE_REF: ${{ github.base_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ] || [ "$BASE_REF" != main ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            echo "tune-changes=false" >> "$GITHUB_OUTPUT"
            suite=true
            if [ "$EVENT" = push ]; then
              if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                refresh=$(git diff --name-only "$BEFORE" "$SHA" -- \
                  Cargo.lock fuzz/Cargo.lock rust-toolchain.toml .github/workflows/rust.yml)
                if [ -z "$refresh" ]; then suite=false; fi
              else
                echo "push range $BEFORE..$SHA cannot be diffed: the suite runs"
              fi
            fi
            echo "suite=$suite" >> "$GITHUB_OUTPUT"
            echo "$EVENT into ${BASE_REF:-nothing}: code=true suite=$suite"
            exit 0
          fi
          echo "suite=true" >> "$GITHUB_OUTPUT"
          all=$(git diff --name-only "$BASE" HEAD)
          code=false
          if [ -z "$all" ] || grep -qv '\.md$' <<<"$all"; then code=true; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "$(grep -c . <<<"$all" || true) files changed; code=$code"
          tune=false
          case "$HEAD_REF" in
            tune/*) tune=true ;;
          esac
          if [ "$tune" = true ]; then
            outside=$(grep -Ev '^content/|^modes/|^tests/corpus/|^tests/golden/|^tests/bench_pins\.toml$|\.md$' <<<"$all" || true)
            if [ -n "$outside" ]; then
              echo "Error: tune/ PR touches files outside content/, modes/, tests/corpus/, tests/golden/, tests/bench_pins.toml:" >&2
              echo "$outside" >&2
              exit 1
            fi
            rustup toolchain install
            git worktree add "$RUNNER_TEMP/base" "$BASE"
            cargo run --quiet --bin content-pack -- compare --numbers-only "$RUNNER_TEMP/base/content" content
            cargo test --locked --test integration corpus::
            echo "tune-changes=true" >> "$GITHUB_OUTPUT"
            echo "tune/ PR verified: numbers-only and corpus match"
          else
            echo "tune-changes=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: fmt and clippy
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # The dependencies' build, per job and runner (this crate's own is dropped before saving).
      # Only runs on main save it (push and the weekly run): a PR reads main's, and the
      # repository's 10 GB of cache holds main's rather than one copy per PR.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings

  # Every generated set (schema, corpus, goldens, content pack) is as committed: `cargo xtask
  # bless --check` regenerates them and fails, naming the stale sets, when a diff appears.
  bless:
    name: generated sets
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.suite == 'true' && needs.changes.outputs.tune-changes != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo xtask bless --check

  # A frozen corpus version (`tests/corpus/v<N>/`, N >= 1) is never edited: new versions and new
  # files may be added, nothing in one may be modified, deleted or renamed. The diff against the
  # PR's base catches what the test cannot (a deleted folder, a restored old byte); the test
  # (`corpus::the_frozen_corpus_is_unchanged`, checks the manifest) is an ordinary integration test
  # that every leg of `tests` runs, so this job does not build it again. It runs on every PR,
  # docs-only ones too, and `rust checks` fails when it is skipped on one. A pathspec such as
  # `-- 'tests/corpus/v[1-9]*/'` matches nothing in git, so the names are filtered with grep;
  # `--no-renames` lists a file moved out of a frozen folder as a deletion of its old path.
  frozen:
    name: frozen corpus unchanged
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Nothing in a frozen corpus folder changed
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed=$(git diff --no-renames --diff-filter=MDR --name-only "$BASE"...HEAD | grep -E '^tests/corpus/v[1-9][0-9]*/' || true)
          if [ -n "$changed" ]; then
            echo "::error::a frozen corpus folder (tests/corpus/v<N>/, N >= 1) was changed; new folders and new files may be added, nothing in one may be modified, deleted or renamed:"
            echo "$changed" >&2
            exit 1
          fi
          echo "no frozen corpus file changed"

  test:
    name: tests on ${{ matrix.arch }} (${{ matrix.profile }})
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.suite == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    # bash on every runner: the Windows default is PowerShell.
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            profile: debug
          - arch: x86_64
            runner: ubuntu-latest
            profile: release
          - arch: arm64
            runner: ubuntu-24.04-arm
            profile: debug
          - arch: arm64
            runner: ubuntu-24.04-arm
            profile: release
          - arch: windows-x86_64
            runner: windows-latest
            profile: release
          - arch: macos-arm64
            runner: macos-latest
            profile: release
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # `key`: the debug and release legs of one runner would otherwise share a key, and one of
      # them could not save.
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.profile }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: uname -m && rustc -vV
      # cargo-nextest runs each test in its own process, times it and writes a JUnit file
      # (.config/nextest.toml, profile `ci`). The release binary, checked against the checksum
      # pinned in install-action's manifest; never a build from another source.
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
          fallback: none
      # `record` (ADR-BRDG-3 point 3) only adds code, so --all-features is a superset of the default build's
      # tests, and it also runs the recording tests that the default build skips. The debug build
      # (overflow checks on) runs as its own leg on the two Linux runners, beside the release leg of
      # the same runner; the slower Windows and macOS runners run the release build only.
      - if: matrix.profile == 'debug'
        run: cargo nextest run --locked --all-features --profile ci
      # nextest skips doctests; there are none today, and this fails the day one is added and
      # breaks. Once is enough: a doctest does not depend on the architecture. It builds the same
      # --all-features debug build as the run above, so it sits in the same leg.
      - if: matrix.arch == 'x86_64' && matrix.profile == 'debug'
        run: cargo test --doc --locked --all-features
      # The corpus and the pinned hashes are not behind `record`: they run here in the release
      # leg of all four runners (and in the debug legs). The unfiltered run also holds
      # `corpus::the_frozen_corpus_is_unchanged`, so the `frozen` job only diffs.
      - if: matrix.profile == 'release'
        run: cargo nextest run --locked --release --profile ci
      # The ignored measurement of MAX_COMMANDS (tests/command_cap.rs), in release, here and not only in
      # deep.yml: a PR that makes a bot run take more commands fails here and re-pins MEASURED_MOST in
      # the same PR. The flags are the release run's above, so nothing is rebuilt (--all-features would
      # rebuild). ~20 s. The JUnit file of the release run is moved aside first, this run's after.
      - name: Command cap measurement (longest bot run)
        if: matrix.arch == 'x86_64' && matrix.profile == 'release'
        run: |
          mv target/nextest/ci/junit.xml target/nextest/ci/junit-release.xml
          status=0
          cargo nextest run --locked --release --profile ci --run-ignored only -E 'test(=command_cap::measure_the_longest_run)' || status=$?
          mv target/nextest/ci/junit.xml target/nextest/ci/junit-command-cap.xml || true
          if [ "$status" -ne 0 ]; then
            echo "::error title=Command cap measurement::A bot run takes a different number of commands than MEASURED_MOST (more or fewer). Set MEASURED_MOST in tests/command_cap.rs to the 'most commands:' value printed above, in this PR, and keep 2 x it <= MAX_COMMANDS (src/run_replay.rs). If the failure is the MAX_COMMANDS or verify assertion instead, the cap itself is in question: ask Kade."
          fi
          exit "$status"
      # The ten slowest tests of each run and the tests counted, from the JUnit files (nextest's
      # own log lists only those past `slow-timeout`, 30 s).
      - name: List the slowest tests
        if: always()
        run: |
          shopt -s nullglob
          files=(target/nextest/ci/junit*.xml)
          if [ ${#files[@]} -eq 0 ]; then echo "no JUnit file"; exit 0; fi
          python3 -I - "${files[@]}" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          for path in sys.argv[1:]:
              cases = list(ET.parse(path).iter("testcase"))
              cases.sort(key=lambda c: float(c.get("time", 0)), reverse=True)
              print(f"### {path.rsplit('/', 1)[-1]}: {len(cases)} tests, slowest first")
              for c in cases[:10]:
                  print(f"- {float(c.get('time', 0)):.2f} s {c.get('classname')} {c.get('name')}")
          PY
      - name: Upload the test times
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-${{ matrix.arch }}-${{ matrix.profile }}
          path: target/nextest/ci/junit*.xml
          if-no-files-found: ignore
      # A corpus mismatch writes the snapshots of the first diverging tick and the one before to
      # target/corpus-diff (tests/corpus.rs); one artifact per architecture and profile to compare them.
      - name: Upload the corpus diff
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-diff-${{ matrix.arch }}-${{ matrix.profile }}
          path: target/corpus-diff
          if-no-files-found: ignore

  cross:
    name: cargo check for mobile targets
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: |
          for t in aarch64-apple-ios aarch64-linux-android x86_64-linux-android; do
            cargo check --locked --all-targets --target "$t"
          done

  # The `net/` crate (`stella-rain-net`): the commands above select core alone (the
  # workspace's default member), so net has its own fmt, clippy, tests, docs and mobile check.
  net:
    name: net crate fmt, clippy, tests and mobile check
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt -p stella-rain-net --check
      - run: cargo clippy -p stella-rain-net --all-targets --locked -- -D warnings
      - run: cargo test -p stella-rain-net --locked
      - run: RUSTDOCFLAGS="-D warnings" cargo doc -p stella-rain-net --no-deps --locked
      - run: |
          for t in aarch64-apple-ios aarch64-linux-android x86_64-linux-android; do
            cargo check -p stella-rain-net --locked --all-targets --target "$t"
          done

  fuzz-stable:
    name: fuzz crate fmt, clippy and tests
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      # Every target on the corpus files, every prefix and flipped byte of them, and the
      # crashes that real fuzz runs found (fuzz/regressions/).
      - run: cargo test --manifest-path fuzz/Cargo.toml --locked

  fuzz-build:
    name: fuzz targets build (nightly)
    # Skipped on a PR whose `parsing changed` is true: the short run below builds the same
    # targets on the same nightly. It runs where the suite runs off a PR (a push to main that
    # changed a cache file, which saves the nightly cache the short run reads, and the weekly run)
    # and on a PR that touches no parsing. `!cancelled()`: `fuzz-changes` is skipped
    # off a PR, which would skip this job too.
    needs: [changes, fuzz-changes]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' && needs.changes.outputs.suite == 'true' && needs.fuzz-changes.outputs.parsing != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
      # The cache's key holds the stable rustc; `key` adds the nightly the fuzz build uses.
      # cargo-fuzz has its own cache below, so this one leaves ~/.cargo/bin alone.
      # shared-key: fuzz-build and fuzz-short build the same targets, and fuzz-short runs only on
      # PRs, so it reads the cache fuzz-build saves on main.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          shared-key: fuzz-nightly
          key: ${{ env.FUZZ_NIGHTLY }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # cargo-fuzz built once per version and runner, from source as before.
      - id: cargo-fuzz
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      - run: cargo "+$FUZZ_NIGHTLY" fuzz build

  fuzz-changes:
    name: parsing changed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      parsing: ${{ steps.diff.outputs.parsing }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # The code that reads untrusted files (ADR-SVC-1), the fuzz crate and this workflow.
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only "$BASE" HEAD -- \
            src/validate.rs src/validate src/stage.rs src/behaviour.rs src/attack.rs src/input.rs \
            src/replay.rs src/share.rs src/base64.rs src/registry.rs src/presets.rs \
            src/id.rs src/fixed.rs src/version.rs src/run_setup.rs modes \
            src/rewards.rs src/run_stats.rs src/expertise.rs src/stage_skill.rs \
            src/run_replay.rs src/run_replay src/run_replay_tests.rs src/run_content.rs src/weapon.rs src/match_ups.rs \
            src/runes.rs src/rune.rs src/time_limit.rs src/pack.rs src/pack src/attack_presets.rs src/weapons.rs \
            src/difficulties.rs src/starting_unlocks.rs src/rules.rs src/stardust.rs src/progression.rs src/constellations.rs src/step_log.rs src/step_log src/step_log_tests.rs content \
            tests/fixtures/run_setup net fuzz .github/workflows/rust.yml)
          if [ -n "$changed" ]; then
            echo "parsing=true" >> "$GITHUB_OUTPUT"
            echo "changed: $(echo "$changed" | wc -l) files"
          else
            echo "parsing=false" >> "$GITHUB_OUTPUT"
          fi

  fuzz-short:
    name: short fuzz run
    needs: fuzz-changes
    if: needs.fuzz-changes.outputs.parsing == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - run: rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
      # The cache's key holds the stable rustc; `key` adds the nightly the fuzz build uses.
      # cargo-fuzz has its own cache below, so this one leaves ~/.cargo/bin alone.
      # shared-key: fuzz-build and fuzz-short build the same targets, and fuzz-short runs only on
      # PRs, so it reads the cache fuzz-build saves on main.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
          shared-key: fuzz-nightly
          key: ${{ env.FUZZ_NIGHTLY }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # cargo-fuzz built once per version and runner, from source as before.
      - id: cargo-fuzz
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-fuzz
          key: cargo-fuzz-${{ env.CARGO_FUZZ_VERSION }}-${{ runner.os }}-${{ runner.arch }}
      - if: steps.cargo-fuzz.outputs.cache-hit != 'true'
        run: cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      # The corpus stages and replays (`tests/corpus/current/`, read by corpus_paths.py), the run setups of
      # tests/fixtures/run_setup/, the bundled content/ files and the bundled content pack
      # (`content-pack export`) are the seeds;
      # nothing generated is committed. stage_parse also reads its bytes as rewards and run stats,
      # so the content files seed the stage targets too.
      - name: Seeds from the replay corpus
        run: |
          mkdir -p seeds/setup seeds/pack
          python3 .github/scripts/corpus_paths.py seeds seeds/stage seeds/replay
          cp tests/fixtures/run_setup/*.json seeds/setup/
          cp content/*.json seeds/stage/
          cargo run --locked --bin content-pack -- export > seeds/pack/bundled.pack
      - name: Seeds for savepoint_load
        run: |
          set -eu
          # Generated, not committed: the bytes move with SAVEPOINT_FORMAT and SIM_VERSION. The test
          # runs in fuzz/, so the folder is absolute: cargo fuzz reads seeds/savepoint of the root.
          SAVEPOINT_SEEDS_DIR="$PWD/seeds/savepoint" cargo test --manifest-path fuzz/Cargo.toml --locked --test smoke write_savepoint_seeds -- --ignored
          test -n "$(find seeds/savepoint -type f)"
          find seeds/savepoint -type f | wc -l
      - name: Seeds for step_log_range
        run: |
          set -eu
          # Generated, not committed: the bytes move with the step log format and SIM_VERSION. The test
          # runs in fuzz/, so the folder is absolute: cargo fuzz reads seeds/step_log_range of the root.
          STEP_LOG_RANGE_SEEDS_DIR="$PWD/seeds/step_log_range" cargo test --manifest-path fuzz/Cargo.toml --locked --test smoke write_step_log_range_seeds -- --ignored
          test -n "$(find seeds/step_log_range -type f)"
          find seeds/step_log_range -type f | wc -l
      - name: Seeds for net_decode
        run: |
          set -eu
          # Generated, not committed: the bytes move with PROTOCOL_VERSION and the wire layout. The test
          # runs in fuzz/, so the folder is absolute: cargo fuzz reads seeds/net of the root.
          NET_SEEDS_DIR="$PWD/seeds/net" cargo test --manifest-path fuzz/Cargo.toml --locked --test smoke write_net_seeds -- --ignored
          test -n "$(find seeds/net -type f)"
          find seeds/net -type f | wc -l
      - name: Fuzz each target for 60 seconds, one per CPU
        run: |
          set -eu
          # Every target of fuzz/Cargo.toml, checked against fuzz/fuzz_targets/ (an assignment, so
          # a failing script stops the step).
          targets=$(python3 .github/scripts/fuzz_targets.py words)
          # Built once here, so the runs below start at once instead of each waiting on cargo.
          cargo "+$FUZZ_NIGHTLY" fuzz build
          # One libFuzzer process uses one CPU: one target per CPU (4 on a GitHub runner), each
          # still for 60 seconds. Each run writes its own log, shown below in order, so the outputs
          # do not interleave; a failed run leaves a .failed mark.
          mkdir -p fuzz-logs
          # shellcheck disable=SC2317,SC2329 # called by xargs, through bash -c
          fuzz_one() {
            target=$1
            # A seed longer than -max_len is cut to it: pack_load takes a whole pack
            # (Pack::MAX_BYTES) and one byte more, the others 64 KiB.
            max_len=65536
            case "$target" in
              stage_*) seeds=seeds/stage ;;
              replay_load) seeds=seeds/replay ;;
              run_setup) seeds=seeds/setup ;;
              pack_load) seeds=seeds/pack max_len=1048577 ;;
              savepoint_load) seeds=seeds/savepoint ;;
              step_log_range) seeds=seeds/step_log_range ;;
              net_decode) seeds=seeds/net ;;
              *) seeds= ;;
            esac
            echo "start $target"
            # shellcheck disable=SC2086
            if ! cargo "+$FUZZ_NIGHTLY" fuzz run "$target" $seeds -- -max_total_time=60 -max_len="$max_len" \
              > "fuzz-logs/$target.log" 2>&1; then
              touch "fuzz-logs/$target.failed"
            fi
            echo "done $target"
          }
          export -f fuzz_one
          # shellcheck disable=SC2016 # $1 is bash -c's argument, expanded there
          echo "$targets" | tr ' ' '\n' | xargs -P "$(nproc)" -I{} bash -c 'fuzz_one "$1"' _ {}
          status=0
          for target in $targets; do
            echo "::group::$target"
            cat "fuzz-logs/$target.log"
            echo "::endgroup::"
            if [ -e "fuzz-logs/$target.failed" ]; then
              echo "::error title=fuzz $target::$target failed; its log is in the group above, its input in fuzz-artifacts"
              status=1
            fi
          done
          exit "$status"
      # A crash input is a stage, replay, pack or share code, so it can be read here and replayed with
      # `cargo fuzz run <target> <file>`; copy it to fuzz/regressions/<target>/ with the fix.
      - name: Upload the crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore

  # The benches are the keys of benches/budgets.toml, one bench target each: a rename or a new
  # bench edits the budgets file and the target, not this workflow. The `bench` job runs one
  # shard per target and architecture.
  bench-list:
    name: bench targets
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: List the benches
        id: list
        run: |
          set -eu
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import re
          import tomllib
          with open("benches/budgets.toml", "rb") as f:
              names = list(tomllib.load(f))
          # A name is a bench target, a cache key, an artifact name and a `--bench` argument.
          bad = [n for n in names if not re.fullmatch(r"[a-z_][a-z0-9_]*", n)]
          if bad:
              raise SystemExit(f"benches/budgets.toml: not a bench target name: {bad}")
          print("names=" + json.dumps(names))
          PY

  bench:
    name: "worst-case tick on ${{ matrix.arch }}: ${{ matrix.bench }}"
    needs: [changes, bench-list]
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    # One codegen unit for every bench build of the job, the base commit's included, so that both
    # sides are counted as `[profile.bench]` of Cargo.toml now builds them. Set here rather than
    # read from the PR's Cargo.toml, which would also bring the PR's dependencies and features
    # into the base's count. With the default 16 units, any change to the crate moves what is
    # inlined into the tick (core#191: +2.01% on arm64 from code no tick calls).
    env:
      CARGO_PROFILE_BENCH_CODEGEN_UNITS: "1"
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
        bench: ${{ fromJSON(needs.bench-list.outputs.names) }}
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - run: sudo apt-get update && sudo apt-get install -y valgrind
      # The release binary, checked against the checksum pinned in install-action's manifest;
      # never a build from another source (`fallback: none`).
      - uses: taiki-e/install-action@v2
        with:
          tool: iai-callgrind-runner@${{ env.IAI_CALLGRIND_RUNNER_VERSION }}
          fallback: none
      # The base commit and the PR build in separate target directories. In one, cargo takes the
      # PR's crate for the base's (same name, same path in the workspace), finds it newer than the
      # PR's sources and counts the base twice. iai-callgrind keeps its baselines in one home that
      # both share, so the PR is compared with the base's, on this runner and this architecture.
      # The head builds in the workspace's ./target, the directory rust-cache restores and saves, so
      # its dependencies are cached (the base builds in $RUNNER_TEMP/target-base, cold when main's
      # counts of it are not cached).
      - run: |
          {
            echo "IAI_CALLGRIND_HOME=$RUNNER_TEMP/iai"
            echo "BENCHES=--bench $BENCH"
          } >> "$GITHUB_ENV"
        env:
          BENCH: ${{ matrix.bench }}
      # What a count depends on besides the commit. main's push run saves each shard's counts under
      # a key that holds it, and a PR restores only an exact match, so a toolchain, glibc or
      # valgrind update is a cache miss and the PR counts its base itself.
      - name: Fingerprint the counting environment
        id: fp
        run: |
          set -eu
          fp=$({
            rustc -vV
            valgrind --version
            ldd --version | sed -n 1p
            echo "$IAI_CALLGRIND_RUNNER_VERSION"
            echo "$CARGO_PROFILE_BENCH_CODEGEN_UNITS"
            uname -m
          } | sha256sum | cut -c1-16)
          echo "value=$fp" >> "$GITHUB_OUTPUT"
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check the base commit
        id: base
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          NAMES: ${{ matrix.bench }}
        run: |
          set -eu
          for name in $NAMES; do
            if ! git cat-file -e "$BASE:benches/$name.rs" 2>/dev/null; then
              echo "The base commit lacks the benchmark $name: nothing to compare with."
              echo "compare=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          # Per case, not per PR (ADR-SIM-6 point 5): a case is compared when its pre-tick digests (before,
          # stage, input) in tests/bench_pins.toml are equal at the base and here and the target's
          # bench file and benches/support/ are unchanged. A moved case is reported, not gated, so a
          # PR may change code and the bench together. bench_pins.py writes compare= and cases=.
          git show "$BASE:tests/bench_pins.toml" > "$RUNNER_TEMP/pins-base.toml" 2>/dev/null || : > "$RUNNER_TEMP/pins-base.toml"
          changed=false
          for name in $NAMES; do
            git diff --quiet "$BASE" HEAD -- "benches/$name.rs" benches/support || changed=true
          done
          python3 .github/scripts/bench_pins.py --base "$RUNNER_TEMP/pins-base.toml" --head tests/bench_pins.toml \
            --bench "$NAMES" --bench-changed "$changed"
      # The base commit's counts from main's push run, if it saved them for this toolchain: the
      # exact commit and fingerprint, never a near match (no restore-keys), which would be another
      # commit's count.
      - name: Restore the base counts
        id: restore
        if: steps.base.outputs.compare == 'true'
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/iai
          key: bench-base-v1-${{ matrix.arch }}-${{ matrix.bench }}-${{ github.event.pull_request.base.sha }}-${{ steps.fp.outputs.value }}
      - name: Count the base commit
        if: steps.base.outputs.compare == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HIT: ${{ steps.restore.outputs.cache-hit }}
          KEY: bench-base-v1-${{ matrix.arch }}-${{ matrix.bench }}-${{ github.event.pull_request.base.sha }}-${{ steps.fp.outputs.value }}
        run: |
          set -eu
          if [ "$HIT" = true ]; then
            echo "base counts restored from main's run (cache key $KEY)"
            exit 0
          fi
          echo "base counted here: no cache for $KEY"
          git worktree add "$RUNNER_TEMP/base" "$BASE"
          # shellcheck disable=SC2086
          (cd "$RUNNER_TEMP/base" && CARGO_TARGET_DIR="$RUNNER_TEMP/target-base" cargo bench $BENCHES -- --save-baseline=main)
      # The counts. Comparing with the base commit only prints the change; whether a rise fails is
      # decided by `Check for a rise` below, so that a covered rise does not stop the job (ADR-SIM-6 point 3).
      - name: Count the benches
        id: count
        env:
          COMPARE: ${{ steps.base.outputs.compare }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          limits=""
          if [ "$COMPARE" = true ]; then
            limits="--baseline=main"
          elif [ "$EVENT" = push ]; then
            # main's own count, kept for the PRs whose base this commit becomes.
            limits="--save-baseline=main"
          fi
          # shellcheck disable=SC2086
          cargo bench $BENCHES -- $limits | tee "$RUNNER_TEMP/bench.txt"
      # Only the push run saves (not the weekly schedule): a PR that starts from this commit
      # restores these counts instead of building and counting it again.
      - name: Save the counts for the PRs on this commit
        if: github.event_name == 'push'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/iai
          key: bench-base-v1-${{ matrix.arch }}-${{ matrix.bench }}-${{ github.sha }}-${{ steps.fp.outputs.value }}
      # The per-function profile of every case, base against head, on every run (ADR-SIM-6 point 2): what a
      # rise is made of, and what to open when a budget is near.
      - name: Profile the benches
        if: ${{ !cancelled() && steps.count.outcome == 'success' }}
        env:
          ARCH: ${{ matrix.arch }}
        run: python3 .github/scripts/callgrind_diff.py --arch "$ARCH" --home "$IAI_CALLGRIND_HOME" --out "$RUNNER_TEMP/profile"
      # One artifact per shard; `bench profile` merges them into bench-profile-<arch>.
      - name: Upload the profile
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: bench-shard-${{ matrix.arch }}-${{ matrix.bench }}
          path: |
            ${{ runner.temp }}/profile
            ${{ runner.temp }}/iai/**/callgrind.*.out*
          retention-days: 1
          if-no-files-found: warn
      # The absolute ceiling (benches/budgets.toml, ADR-SIM-6 point 1): a count over the budget for this
      # architecture fails the job, whether or not the base commit was compared (ADR-SIM-6 point 1).
      - name: Check the tick budgets
        if: ${{ !cancelled() && steps.count.outcome == 'success' }}
        env:
          ARCH: ${{ matrix.arch }}
          BENCH: ${{ matrix.bench }}
        run: python3 .github/scripts/bench_budget.py --arch "$ARCH" --bench "$BENCH" --bench-output "$RUNNER_TEMP/bench.txt"
      # A profile that counts the drop of a bench fixture (drop_glue of an Engine, Run or Case under the
      # bench wrapper) measures the heap layout, not the tick (ADR-SIM-6). This reads the measured profile;
      # tests/bench_teardown.rs is the check of the bench text. It fails when it cannot read a profile.
      - name: Check the teardown of the benches
        if: ${{ !cancelled() && steps.count.outcome == 'success' }}
        run: python3 .github/scripts/bench_drop_guard.py --home "$IAI_CALLGRIND_HOME"
      # A compared case that rose over BENCH_ALARM_PCT fails unless a new entry of benches/accepted.toml,
      # merged by Kade, names this PR and covers the count (ADR-SIM-6 point 3). The base commit's ledger
      # tells new entries from old ones. A case that moved is printed, not gated (ADR-SIM-6 point 5).
      - name: Check for a rise
        if: ${{ !cancelled() && steps.count.outcome == 'success' && steps.base.outputs.compare == 'true' }}
        env:
          ARCH: ${{ matrix.arch }}
          BASE: ${{ github.event.pull_request.base.sha }}
          PR: ${{ github.event.pull_request.number }}
          CASES: ${{ steps.base.outputs.cases }}
        run: |
          set -eu
          git show "$BASE:benches/accepted.toml" > "$RUNNER_TEMP/accepted-base.toml" 2>/dev/null || : > "$RUNNER_TEMP/accepted-base.toml"
          python3 .github/scripts/bench_alarm.py --arch "$ARCH" --bench-output "$RUNNER_TEMP/bench.txt" \
            --limit-pct "$BENCH_ALARM_PCT" --accepted benches/accepted.toml \
            --accepted-base "$RUNNER_TEMP/accepted-base.toml" --pr "$PR" --cases "$CASES"

  # The profile of every shard of one architecture, as one artifact: the name and the contents
  # (per case `*.diff.txt`, `*.diff-inclusive.txt` and the callgrind files, one directory per
  # shard) that ADR-SIM-6 point 4, bench_alarm.py and callgrind_diff.py name.
  bench-profile:
    name: bench profile on ${{ matrix.arch }}
    needs: [changes, bench]
    if: ${{ !cancelled() && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    strategy:
      matrix:
        arch: [x86_64, arm64]
    steps:
      - uses: actions/upload-artifact/merge@v7
        with:
          name: bench-profile-${{ matrix.arch }}
          pattern: bench-shard-${{ matrix.arch }}-*
          separate-directories: true
          delete-merged: true
          retention-days: 30

  # RustSec advisories, licences and sources of the whole graph (deny.toml), for this workspace and
  # fuzz/, in one job on the pinned release binary (the checksum is checked before it is unpacked).
  # Runs on the weekly schedule too, because advisories change without a PR. `cargo deny` runs
  # `cargo metadata`, so the toolchain is installed first.
  cargo-deny:
    name: cargo deny
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      CARGO_DENY_VERSION: "0.20.2"
      CARGO_DENY_SHA256: "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - name: Install cargo-deny
        run: |
          set -euo pipefail
          name="cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$RUNNER_TEMP/cargo-deny.tgz" \
            "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/${name}.tar.gz"
          echo "${CARGO_DENY_SHA256}  $RUNNER_TEMP/cargo-deny.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cargo-deny.tgz" -C "$RUNNER_TEMP"
          install -D "$RUNNER_TEMP/${name}/cargo-deny" "$HOME/.local/bin/cargo-deny"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: cargo deny --version
      - run: cargo deny --manifest-path Cargo.toml check
      - if: ${{ !cancelled() }}
        run: cargo deny --manifest-path fuzz/Cargo.toml check

  # The one check auto-merge.yml requires from this workflow. A job may be skipped only when it
  # need not run: `parsing changed` and `frozen corpus unchanged` off a PR, the short fuzz run when
  # `parsing changed` says no, `fuzz targets build` when it says yes (the short run builds the
  # same targets), the suite jobs when `what changed` says no (a docs-only PR, or a push that
  # changed no cache file), the bench jobs when it says no code; every other skipped, failed or
  # cancelled job fails this one.
  checks:
    name: rust checks
    needs: [changes, fuzz-changes, lint, bless, frozen, test, cross, net, fuzz-stable, fuzz-build, fuzz-short, bench-list, bench, bench-profile, cargo-deny]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - env:
          EVENT: ${{ github.event_name }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          code=$(jq -r '.changes.outputs.code // ""' <<<"$NEEDS")
          parsing=$(jq -r '."fuzz-changes".outputs.parsing // ""' <<<"$NEEDS")
          tune=$(jq -r '.changes.outputs."tune-changes" // ""' <<<"$NEEDS")
          suite=$(jq -r '.changes.outputs.suite // ""' <<<"$NEEDS")
          # A job of the suite may be skipped when `what changed` says so; with an empty output (it
          # failed) a skipped job still fails below.
          suite_off=false
          if [ "$code" = false ] || [ "$suite" = false ]; then suite_off=true; fi
          pr=false
          if [ "$EVENT" = pull_request ]; then pr=true; fi
          fail=0
          for job in $(jq -r 'keys[]' <<<"$NEEDS"); do
            result=$(jq -r --arg j "$job" '.[$j].result' <<<"$NEEDS")
            case "$job" in
              changes) runs=true ;;
              frozen) runs=$pr ;;
              bench-list|bench|bench-profile) runs=$code ;;
              lint|test|cross|net|fuzz-stable|cargo-deny) runs=true; if [ "$suite_off" = true ]; then runs=false; fi ;;
              fuzz-changes) runs=$pr ;;
              # No `parsing` off a PR, or when `parsing changed` failed, which fails this anyway.
              fuzz-short) runs=false; if [ "$parsing" = true ]; then runs=true; fi ;;
              # Skipped when the short run builds the same targets (only a PR has `parsing`).
              fuzz-build) runs=true; if [ "$suite_off" = true ] || [ "$parsing" = true ]; then runs=false; fi ;;
              bless) runs=false; if [ "$suite_off" = false ] && [ "$tune" != true ]; then runs=true; fi ;;
              *) runs=$code ;;
            esac
            if [ "$result" = success ] || { [ "$result" = skipped ] && [ "$runs" = false ]; }; then
              echo "$job: $result"
            else
              echo "::error::$job: $result (code=$code suite=$suite parsing=$parsing tune=$tune)"
              fail=1
            fi
          done
          exit "$fail"
