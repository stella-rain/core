# Deletes merged `claude/*` branches still at their PR's head commit (ADR-053): the PRs Kade
# merges by hand keep their branch. The reusable workflow in stella-rain/.github decides and
# deletes; it reads its script from that repository's main.
name: Branch cleanup

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  cleanup:
    uses: stella-rain/.github/.github/workflows/branch-cleanup.yml@main
    permissions:
      contents: write       # delete branches
      pull-requests: read   # list the PRs
