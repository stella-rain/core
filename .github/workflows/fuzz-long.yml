# The long fuzz run of every fuzz target (`fuzz/fuzz_targets/`, listed by .github/scripts/fuzz_targets.py;
# ADR-020 item 7, ADR-054): every week, on demand, and as a reusable workflow for Candidate
# (candidate.yml calls it).
# `rust.yml` keeps the 60-second run of a PR that touches parsing.
#
# Each target runs in its own job and keeps a corpus that grows from run to run in the Actions
# cache. A failed run uploads the crash inputs for 14 days and opens one issue per target (or
# comments on the open one) with the target, commit, run and the inputs' sizes and hashes, never
# their contents (.github/scripts/fuzz-report.sh). This repository is public, so the artifact
# and the run's log (libFuzzer prints a crashing input) can be read by anyone: that is the same
# exposure as the short run. A scheduled run is not a PR check, so auto-merge.yml does not name it.
name: Fuzz (long)

on:
  schedule:
    # Mondays, 03:23 UTC.
    - cron: "23 3 * * 1"
  workflow_dispatch:
    inputs:
      minutes:
        description: Minutes per target
        type: number
        default: 7
  workflow_call:
    inputs:
      minutes:
        description: Minutes per target
        type: number
        default: 7

permissions: {}

env:
  # The same pins as rust.yml.
  FUZZ_NIGHTLY: nightly-2026-10-09
  CARGO_FUZZ_VERSION: 0.13.2
  # A scheduled run has no inputs.
  MINUTES: ${{ inputs.minutes || 7 }}

jobs:
  # The matrix is the [[bin]] table of fuzz/Cargo.toml, checked against fuzz/fuzz_targets/.
  targets:
    name: fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: list
        run: |
          set -eu
          names=$(python3 .github/scripts/fuzz_targets.py json)
          echo "names=$names" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz ${{ matrix.target }}
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.names) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: rustup toolchain install "$FUZZ_NIGHTLY" --profile minimal
      - run: cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"
      # The newest corpus of an earlier run of this target. A new key is saved at the end, so the
      # corpus keeps growing; with no cache the run starts from the seeds below.
      - uses: actions/cache/restore@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # The corpus stages and replays (`tests/corpus/current/`, read by corpus_paths.py), the run setups of
      # tests/fixtures/run_setup/, the bundled content/ files and the bundled content pack
      # (`content-pack export`) are the seeds;
      # nothing generated is committed. stage_parse also reads its bytes as rewards and run stats,
      # so the content files seed the stage targets too.
      - name: Seeds from the replay corpus
        run: |
          mkdir -p seeds/setup seeds/pack
          python3 .github/scripts/corpus_paths.py seeds seeds/stage seeds/replay
          cp tests/fixtures/run_setup/*.json seeds/setup/
          cp content/*.json seeds/stage/
          cargo run --locked --bin content-pack -- export > seeds/pack/bundled.pack
      - name: Seeds for savepoint_load
        if: matrix.target == 'savepoint_load'
        run: |
          set -eu
          # Generated, not committed: the bytes move with SAVEPOINT_FORMAT and SIM_VERSION. The test
          # runs in fuzz/, so the folder is absolute: cargo fuzz reads seeds/savepoint of the root.
          SAVEPOINT_SEEDS_DIR="$PWD/seeds/savepoint" cargo test --manifest-path fuzz/Cargo.toml --locked --test smoke write_savepoint_seeds -- --ignored
          test -n "$(find seeds/savepoint -type f)"
          find seeds/savepoint -type f | wc -l
      - name: Fuzz ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -eu
          case "$TARGET" in
            stage_*) seeds=seeds/stage ;;
            replay_load) seeds=seeds/replay ;;
            run_setup) seeds=seeds/setup ;;
            pack_load) seeds=seeds/pack ;;
            savepoint_load) seeds=seeds/savepoint ;;
            *) seeds= ;;
          esac
          mkdir -p "fuzz/corpus/$TARGET"
          # The input arrives as text such as 1.0; the script gives whole seconds or stops the step.
          max_total_time=$(python3 .github/scripts/fuzz_seconds.py "$MINUTES")
          # The first directory is the one libFuzzer adds new inputs to.
          # shellcheck disable=SC2086
          cargo "+$FUZZ_NIGHTLY" fuzz run "$TARGET" "fuzz/corpus/$TARGET" $seeds -- \
            -max_total_time="$max_total_time" -max_len=65536
      # Saved even when the run found a crash: the inputs it grew are still worth keeping.
      - uses: actions/cache/save@v6
        if: always()
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      # A crash input is a stage, replay, pack or share code; replay it with
      # `cargo fuzz run <target> <file>` and keep it in fuzz/regressions/<target>/ with the fix.
      - name: Upload the crash inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          retention-days: 14
          if-no-files-found: ignore

  report:
    name: issue for a failed run
    # A failed `targets` job skips `fuzz`, so the report waits for both.
    needs: [targets, fuzz]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job may write issues; it runs the script from the commit being fuzzed. A caller
    # of this workflow must grant `issues: write` too.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # No crash artifact (a build or setup failure) is not an error here: the script then opens
      # the generic issue.
      - run: mkdir -p crashes
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: fuzz-crash-*
          path: crashes
      - name: Open or update the issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/fuzz-report.sh crashes
