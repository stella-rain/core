# One Rust for both development machines and CI (ADR-039); the same file is in `core` and `app`.
# rustup installs this toolchain, with these components and targets, the first time cargo runs.
[toolchain]
channel = "1.93.0"
profile = "minimal"
components = ["rustfmt", "clippy"]
targets = [
    "aarch64-linux-android",
    "x86_64-linux-android",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
