# The bench cases' pins (BS2c). One table per case, keyed by the case id (the `#[bench::<id>]`
# name in `benches/`), in the order of `benches/`.
#   bench  the bench target (a key of `benches/budgets.toml`)
#   before the state hash before the measured tick(s), 16 lowercase hex
#   after  the state hash after them
# Hashes are strings: TOML integers are i64 and these u64 values overflow it.
# `tests/bench_fixture_pins.rs` asserts this file; `UPDATE_BENCH_PINS=1 cargo test
# bench_fixture_pins` writes it. BS2d's bench job reads it from base and head.

[worst_tick]
bench = "worst_tick"
before = "58080c270dda6bac"
after = "d772753c46bdc1dc"

[hit_tick]
bench = "hit_tick"
before = "e85bd3364b22c9e5"
after = "95527ebc68a22c23"

[hit_tick_spread]
bench = "hit_tick"
before = "4b485ac6af094984"
after = "ab1fe8f19a88d366"

[time_limit_tick]
bench = "time_limit_tick"
before = "af22c3b048b1cfaf"
after = "b788190e950c7ba7"

[worst_minute]
bench = "worst_minute"
before = "9d7b2f80aeb6b0b7"
after = "69c14535a0b14994"

[worst_minute_peak]
bench = "worst_minute_peak"
before = "a5a12e05c8179280"
