[package]
name = "stella-rain-core"
version = "0.0.11"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "Deterministic simulation for Stella Rain"
repository = "https://github.com/stella-rain/core"
publish = false
# The integration tests build as one binary, `tests/integration.rs`, not one per file: each
# binary re-optimises and links the engine on its own, which made a release test build spend
# 85% of its time on 62 copies of the same work.
autotests = false

[lib]
name = "stella_rain_core"

[[bin]]
name = "stage-verify"
path = "src/bin/stage_verify.rs"

[[bin]]
name = "content-pack"
path = "src/bin/content_pack.rs"

[features]
# The JSON Lines recorder of ADR-016: commands, domain events and state hashes, for tests and
# debugging. Not in release builds; a bug report is a stage and a replay instead.
record = []

[dependencies]
# Share codes only (ADR-018): zlib compression with a limit on the decompressed size. Pure
# Rust, no `unsafe` (`forbid(unsafe_code)`), no floats; outside the simulation path.
miniz_oxide = "0.8"
# Files and their schema only (ADR-018): parsing stages, events and replays, and generating
# JSON Schema. Never in the simulation path; types use fixed-width integers only.
# `raw_value` keeps each content file of a pack as the bytes it has there (core#148).
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# Only for `content_hash` (ADR-034) and `parsed_stage_hash` (ADR-046): a fixed standard, so a
# crate cannot change its output.
# Never used in the simulation path; the PRNG and the state hash are written in `core`.
sha2 = { version = "0.11.0", default-features = false }

[dev-dependencies]
# Snapshot tests of the JSON Lines recordings (ADR-021), with `cargo insta review` to accept
# an intended change. Tests only; never in the library or the simulation path.
insta = "1.49"
# Property tests (ADR-019, ADR-021): random input sequences with shrinking, so a failing run
# is reported as the shortest inputs that still fail. Tests only; never in the library or the
# simulation path. Without `fork` and `timeout`, which tests do not need.
proptest = { version = "1.11", default-features = false, features = ["std"] }
# Instruction counts of a worst-case tick under Valgrind (ADR-021): the same count on every run
# of a build, so a CI runner's load does not move it. Tests only; never in the library or the
# simulation path. Needs the `iai-callgrind-runner` binary of the same version and `valgrind`.
iai-callgrind = "0.16.1"

[[test]]
name = "integration"
path = "tests/integration.rs"

[[bench]]
name = "worst_tick"
harness = false

[[bench]]
name = "collide_tick"
harness = false

[[bench]]
name = "time_limit_tick"
harness = false

# Overflow behaves the same in every profile (ADR-019): it panics unless the code says
# `wrapping_*` or `saturating_*`. Release and bench would otherwise wrap silently.
[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true

[profile.test]
overflow-checks = true

[profile.bench]
overflow-checks = true
# One codegen unit, so that the tick benches count the tick's code (ADR-058). With the default 16,
# rustc's split of the crate into units moves with any change to the crate, a new module or a
# dependency's feature, and with it what is inlined in the tick: core#148's pack, which no tick
# calls, moved the worst-case tick by +2.01% on arm64 that way, and by nothing at one unit.
codegen-units = 1
