# Instructions per tick, the most a bench may count (ADR-SIM-5 point 1: 4 ms of a 16.7 ms frame on the
# reference phone; ~3.1 G instructions/s on the Lenovo Tab P11 = 12.4 M).
# Each key is a bench target (`benches/<name>.rs`); the CI bench job builds and checks these.
# DIR1 (DS103, DS50): the benches run at the derived enemy cap of 260 (crowd target 200, headroom
# 30%), not 500, and the worst minute holds the crowd at the target of 200 with the elites in the
# room up to the cap. Every budget is about 10% over what CI counted on that head, rounded up to
# the next 100,000 (a single tick) or 100,000,000 (worst_minute), never over the 12.4 M frame
# ceiling above (ADR-SIM-5). A change of the crowd target or the headroom re-baselines them.
# CI counts (arm64 / x86_64) of the Rust run on 308c394, the largest case of each target:
#   worst_tick           4,582,168 /     5,209,747
#   hit_tick             4,048,753 /     4,341,854   (hit_tick_spread, 2,099,552 / 2,286,872, is inside it)
#   time_limit_tick        618,386 /       710,310
#   worst_minute     1,303,881,864 / 1,438,260,698
#   worst_minute_peak      363,139 /       412,062
#   worst_tick_3p        5,221,724 /     5,868,800
#   rollback             4,011,319 /     4,489,420
#   rollback_equip       4,513,342 /     5,037,800
#   rollback_session    39,248,692 /    39,071,489   (rollback_session_w16, run 42721277452 at 4cb25d5)
# time_limit_tick measures tick 295 since the stage bench fixtures run in equipment mode.
# worst_minute counts the 3,600 ticks of the dense minute of the time_limit mode (ticks 7,301 to
# 10,900), worst_minute_peak its heaviest tick by load (tick 10,800, `tests/worst_minute.rs`).
[worst_tick]
arm64 = 5_100_000
x86_64 = 5_800_000

[hit_tick]
arm64 = 4_500_000
x86_64 = 4_800_000

[time_limit_tick]
arm64 = 700_000
x86_64 = 800_000

[worst_minute]
arm64 = 1_400_000_000
x86_64 = 1_600_000_000

[worst_minute_peak]
arm64 = 400_000
x86_64 = 500_000

[worst_tick_3p]
arm64 = 5_800_000
x86_64 = 6_500_000

# worst_tick_combat: the worst_tick crowd with 64 queued step repeats of 16 targets, every elite's
# stagger gauge one short of full and every enemy at its hard-control count (ADR-SIM-5, ADR-SIM-6;
# `bench_fixtures/combat_case.rs`). CI counts (arm64 / x86_64) on the first run of the case:
# 4,402,248 / 4,888,637; budgets by the margin rule ceil(count * 1.1 / 100_000) * 100_000.
[worst_tick_combat]
arm64 = 4_900_000
x86_64 = 5_400_000

[rollback]
arm64 = 4_500_000
x86_64 = 5_000_000

[rollback_equip]
arm64 = 5_000_000
x86_64 = 5_600_000

# rollback_combat: the worst_tick_combat engine (64 queued step repeats, staggered and controlled
# foes) cloned, then the 8 ticks of ADR-SIM-7's window played on the clone (ADR-SIM-5, ADR-SIM-6;
# `bench_fixtures/combat_case.rs`). It exceeds the 12.4 M frame ceiling on purpose: a rollback
# replays 8 crowd ticks at the caps, not one frame's tick, and the shortened window of 2 ticks would
# no longer be comparable with rollback and rollback_equip. Local x86_64 count 32,815,030; the
# arm64 budget is 0.9 of it, the ratio of worst_tick_combat's counts. Budgets by the margin rule
# ceil(count * 1.1 / 100_000) * 100_000; provisional until CI's first counts replace them.
[rollback_combat]
arm64 = 32_500_000
x86_64 = 36_100_000

# rollback_session: one rolling-back Session::advance of the rollback_equip case at window 4 and
# 16 (rollback_session_w4, rollback_session_w16, the largest is _w16), one CloneRing save into an
# empty ring (clone_ring_save) and one into a reused slot of a full ring (clone_ring_resave). The
# ring saves and restores in place. Counts from CI run 42769475044 at head 21a5cd4, x86_64 / arm64:
# w16 11,355,356 / 9,747,306, w4 3,591,607 / 3,092,354, clone_ring_save 279,868 / 165,648,
# clone_ring_resave 92,096 / 42,010 (before, one save was 886,712 on x86_64 and w16 39,071,489 /
# 39,248,692). The budget is the margin rule's ceil(count * 1.1 / 100_000) * 100_000 of the
# largest case. The counts are under the 12.4 M frame ceiling of ADR-SIM-5; the x86_64 budget,
# with its margin, is 100,000 above it.
[rollback_session]
arm64 = 10_800_000
x86_64 = 12_500_000
