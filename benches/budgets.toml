# Instructions per tick, the most a bench may count (ADR-021: 4 ms of a 16.7 ms frame on the
# reference phone; ADR-058: ~3.1 G instructions/s on the Lenovo Tab P11 = 12.4 M).
# Each key is a bench target (`benches/<name>.rs`); the CI bench job builds and checks these.
# DIR1 (DS103, DS50): the benches run at the derived enemy cap of 260 (crowd target 200, headroom
# 30%), not 500, and the worst minute holds the crowd at the target of 200 with the elites in the
# room up to the cap. Every budget is about 10% over what CI counted on that head, rounded up to
# the next 100,000 (a single tick) or 100,000,000 (worst_minute), never over the 12.4 M frame
# ceiling above (ADR-058). A change of the crowd target or the headroom re-baselines them.
# CI counts (arm64 / x86_64), with the budget before DIR1 in brackets:
#   worst_tick         4,177,359 / 4,816,068   [12,400,000 / 11,900,000]
#   hit_tick           3,963,773 / 4,286,001   [ 8,800,000 /  8,900,000]
#   hit_tick_spread    2,072,999 / 2,284,036   (inside the hit_tick target, which has no budget of
#                                               its own for it, tasks#47 item 2)
#   time_limit_tick      640,125 /   731,725   [ 1,800,000 /  1,600,000]
#   worst_minute   1,230,555,048 / 1,365,153,097   [4,600,000,000 / 5,100,000,000]
#   worst_minute_peak    349,661 /   384,059   [ 1,300,000 /  1,400,000]
# worst_minute counts the 3,600 ticks of the dense minute of the time_limit mode (ticks 7,300 to
# 10,900), worst_minute_peak its heaviest tick by load (tick 10,800).
[worst_tick]
arm64 = 4_600_000
x86_64 = 5_300_000

[hit_tick]
arm64 = 4_400_000
x86_64 = 4_800_000

[time_limit_tick]
arm64 = 800_000
x86_64 = 900_000

[worst_minute]
arm64 = 1_400_000_000
x86_64 = 1_600_000_000

[worst_minute_peak]
arm64 = 400_000
x86_64 = 500_000
