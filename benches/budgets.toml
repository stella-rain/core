# Instructions per tick, the most a bench may count (ADR-021: 4 ms of a 16.7 ms frame on the
# reference phone; ADR-058: ~3.1 G instructions/s on the Lenovo Tab P11 = 12.4 M).
# x86_64 is scaled by the measured x86_64/arm64 ratio of worst_tick (11.74 / 12.23 on f108f4f).
# Warn-only until the T1 refactor lands (DS27); then re-measure and make it blocking.
# Each key is a bench target (`benches/<name>.rs`); the CI bench job builds and checks these.
# BR1b: the three below are the benches off bullets.
# time_limit_tick is about 10% above its measured count (DS50: 1,610,205 arm64, 1,447,649 x86_64).
# hit_tick is about 10% above the larger of its two cases (HB1: 7,997,568 arm64, 8,072,866 x86_64). A key is a
# bench target, so hit_tick_spread (3.6 M / 3.7 M, inside the same target) has no budget of its own.
# BR1e-2: worst_minute counts the 3,600 ticks of the dense minute of the time_limit mode (ticks
# 7,300 to 10,900: 500 enemies, 2 elites, a mid-boss arriving at 9,000), worst_minute_peak its
# heaviest tick by load (tick 10,800). Both are about 10% above what CI measured (DS50):
# worst_minute 3,609,753,641 arm64 / 4,024,817,622 x86_64; worst_minute_peak 1,104,066 / 1,236,144.
# worst_minute_peak stays far under the 12.4 M frame ceiling of worst_tick (ADR-058).
[worst_tick]
arm64 = 12_400_000
x86_64 = 11_900_000

[hit_tick]
arm64 = 8_800_000
x86_64 = 8_900_000

[time_limit_tick]
arm64 = 1_800_000
x86_64 = 1_600_000

[worst_minute]
arm64 = 4_000_000_000
x86_64 = 4_500_000_000

[worst_minute_peak]
arm64 = 1_300_000
x86_64 = 1_400_000
