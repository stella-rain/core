# Dependency audit (cargo-deny): RustSec advisories, licences and sources of the whole graph,
# dev-dependencies included. CI runs it on every PR and weekly (`cargo-deny` job in rust.yml),
# for this workspace and for fuzz/. An exception needs a reason line.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # Both come in only through `iai-callgrind`, a dev-dependency of the benches (ADR-SIM-5); no
    # shipped code links them. Dropped when iai-callgrind moves off bincode 1 and
    # proc-macro-error2.
    { id = "RUSTSEC-2025-0141", reason = "bincode 1.3.3 unmaintained; dev-only via iai-callgrind" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 unmaintained; dev-only via iai-callgrind-macros" },
]

# ADR-REL-1. A crate offered under several licences passes when one of them is listed (adler2 is
# 0BSD OR MIT OR Apache-2.0; r-efi adds LGPL, memchr Unlicense). MPL-2.0 is
# not listed: no crate needs it.
[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
]
exceptions = [
    # "(MIT OR Apache-2.0) AND NCSA": NCSA is permissive (OSI approved) and applies to LLVM's
    # libFuzzer code. fuzz/ is a test harness that is never shipped. Unused in the main workspace.
    { crate = "libfuzzer-sys", allow = ["NCSA"] },
]

[bans]
multiple-versions = "warn"
deny = [
    # Netcode libraries ruled out: the rollback session is written in `net/`.
    { crate = "ggrs", reason = "rollback netcode is written in stella-rain-net, not taken from a library" },
    { crate = "bevy_ggrs", reason = "rollback netcode is written in stella-rain-net, not taken from a library" },
    { crate = "backroll", reason = "rollback netcode is written in stella-rain-net, not taken from a library" },
    { crate = "matchbox_socket", reason = "transport belongs to the app; stella-rain-net is sans-IO" },
    # I/O and async crates the sans-IO net crate must not link. A later task that
    # needs one asks Kade and edits this list.
    { crate = "tokio", reason = "stella-rain-net is sans-IO: no async runtime" },
    { crate = "async-std", reason = "stella-rain-net is sans-IO: no async runtime" },
    { crate = "mio", reason = "stella-rain-net is sans-IO: no sockets or event loops" },
    { crate = "socket2", reason = "stella-rain-net is sans-IO: no sockets" },
    { crate = "reqwest", reason = "stella-rain-net is sans-IO: no HTTP client" },
    { crate = "hyper", reason = "stella-rain-net is sans-IO: no HTTP stack" },
    { crate = "tungstenite", reason = "stella-rain-net is sans-IO: no WebSocket stack" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
